name: Sync PUBLIC v5.14.1 baseline

on:
  push:
    branches:
      - sync/v5.14.1

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated v5.14.1 patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'PUBLIC v5.14.1' index.html; then
            echo 'v5.14.1 already present'
          else
            git apply --check .github/v5141-sync.patch
            git apply .github/v5141-sync.patch
          fi
          grep -q 'PUBLIC v5.14.1' index.html
      - name: Split immutable baseline into GitHub-manageable source parts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          src = Path('index.html')
          out = Path('src/baseline')
          parts_dir = out / 'parts'
          parts_dir.mkdir(parents=True, exist_ok=True)
          for old in parts_dir.glob('part-*.html'):
              old.unlink()

          data = src.read_bytes()
          limit = 64 * 1024
          chunks = []
          start = 0
          while start < len(data):
              end = min(start + limit, len(data))
              while end > start:
                  try:
                      data[start:end].decode('utf-8')
                      break
                  except UnicodeDecodeError:
                      end -= 1
              if end == start:
                  raise RuntimeError('UTF-8 split boundary not found')
              chunks.append(data[start:end])
              start = end

          def sha(b): return hashlib.sha256(b).hexdigest()
          entries = []
          for i, chunk in enumerate(chunks):
              name = f'part-{i:03d}.html'
              (parts_dir / name).write_bytes(chunk)
              entries.append({'path': f'parts/{name}', 'bytes': len(chunk), 'sha256': sha(chunk)})
          manifest = {
              'format': 1,
              'encoding': 'utf-8',
              'source': 'index.html',
              'max_part_bytes': limit,
              'bytes': len(data),
              'sha256': sha(data),
              'parts': entries,
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          rebuilt = b''.join((out / e['path']).read_bytes() for e in entries)
          assert rebuilt == data
          assert manifest['sha256'] == '1d3d57aaba730740f8aad78351806fc3cdbbd8d07cc91a5f82bed6ab10a2fdad'
          print(f"PASS: {len(chunks)} parts, sha256={manifest['sha256']}")
          PY
      - name: Commit synchronized baseline and source parts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html AUDIT.md AUDIT.json src/baseline
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m 'chore: sync public v5.14.1 baseline [skip ci]'
          git push
