name: Bootstrap v5.16 app source once

on:
  push:
    branches:
      - feature/v5.16-source-foundation
    paths:
      - '.github/workflows/bootstrap-v516-app.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
      - name: Extract canonical app source from frozen v5.15 oracle
        run: |
          python scripts/build_v515_legacy.py --output /tmp/v515.html
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil

          root = Path('.')
          app = root / 'src' / 'app'
          if app.exists():
              shutil.rmtree(app)
          (app / 'styles').mkdir(parents=True)
          (app / 'runtime').mkdir(parents=True)

          text = Path('/tmp/v515.html').read_text(encoding='utf-8')
          styles = list(re.finditer(r'<style([^>]*)>(.*?)</style>', text, re.S))
          scripts = list(re.finditer(r'<script([^>]*)>(.*?)</script>', text, re.S))
          if len(styles) != 3 or len(scripts) != 16:
              raise SystemExit(f'unexpected inline blocks: styles={len(styles)} scripts={len(scripts)}')

          style_names = ['000-base.css', '010-responsive.css', '020-v515-details.css']
          for name, match in zip(style_names, styles):
              (app / 'styles' / name).write_text(match.group(2).strip('\n') + '\n', encoding='utf-8')
          (app / 'styles' / 'manifest.json').write_text(json.dumps(style_names, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          body0 = scripts[0].group(2)
          decoder = json.JSONDecoder()
          pos = 0
          for marker in ('const NODES=', 'const EDGES=', 'const CHAR_LINKS='):
              index = body0.index(marker, pos)
              start = index + len(marker)
              stripped = body0[start:].lstrip()
              lead = len(body0[start:]) - len(stripped)
              _, end = decoder.raw_decode(stripped)
              pos = start + lead + end
              while pos < len(body0) and body0[pos] in ';\r\n \t':
                  pos += 1

          runtime_names = [
              '000-core.js',
              '010-selection-v55.js',
              '020-preparation-v56.js',
              '030-shared-room-v512.js',
              '040-selection-core-v510.js',
              '050-audit-edge-paint.js',
              '060-fan-edge-paint.js',
              '070-family-focus.js',
              '080-mobile-ui.js',
              '090-public-help.js',
              '100-watch-workspace.js',
              '110-watch-back.js',
              '120-navigation-v514.js',
              '130-featured-route.js',
              '140-details-v515.js',
          ]
          runtime_parts = [body0[pos:].strip('\n') + '\n']
          runtime_parts.extend(scripts[index].group(2).strip('\n') + '\n' for index in range(1, 13))

          featured = scripts[13].group(2)
          assignment = 'window.FEATURED_ROUTE=Object.freeze('
          start = featured.index(assignment)
          end = featured.index('});', start) + 3
          runtime_parts.append(featured[end:].strip('\n') + '\n')
          runtime_parts.append(scripts[15].group(2).strip('\n') + '\n')
          if len(runtime_parts) != len(runtime_names):
              raise SystemExit('runtime extraction count mismatch')
          for name, body in zip(runtime_names, runtime_parts):
              (app / 'runtime' / name).write_text(body, encoding='utf-8')
          (app / 'runtime' / 'manifest.json').write_text(json.dumps(runtime_names, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          shell = text[:styles[0].start()] + '<!--MARVEL_STYLES-->\n' + text[styles[-1].end():]
          overview_start = shell.index('<div id="overview"')
          overview_end = shell.index('<div id="mcu"', overview_start)
          shell = shell[:overview_start] + '<!--MARVEL_OVERVIEW-->\n' + shell[overview_end:]

          shell_scripts = list(re.finditer(r'<script([^>]*)>(.*?)</script>', shell, re.S))
          if len(shell_scripts) != 16:
              raise SystemExit('shell script extraction count mismatch')
          last = shell_scripts[-1]
          prefix = shell[:last.start()]
          for match in reversed(shell_scripts[:-1]):
              prefix = prefix[:match.start()] + prefix[match.end():]
          shell = prefix + '<!--MARVEL_SCRIPTS-->\n' + shell[last.end():]
          (app / 'shell.html').write_text(shell, encoding='utf-8')
          PY
          python tests/test_v516_app_source.py
      - name: Commit canonical app source and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bootstrap-v516-app.yml
          git add src/app
          git commit -m 'refactor: extract canonical app source'
          git push origin HEAD:"${GITHUB_REF_NAME}"
