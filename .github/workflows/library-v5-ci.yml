name: Library v5 canonical freeze CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/library/**'
      - 'data/migration/**'
      - 'data/derived/**'
      - 'data/content_audit/**'
      - 'scripts/library_v5/**'
      - 'tests/library_v5/**'
      - 'views/flowchart/**'
      - 'index.html'
      - '.github/workflows/library-v5-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests/library_v5 -p 'test_*.py' -v
      - name: Capture canonical input hashes
        run: |
          python - <<'PY' > /tmp/canonical-before.json
          import json
          from pathlib import Path
          from scripts.library_v5.canonical_guard import canonical_hashes
          print(json.dumps(canonical_hashes(Path('.')), sort_keys=True, indent=2))
          PY
          python - <<'PY' > /tmp/protected-before.json
          import json
          from pathlib import Path
          from scripts.library_v5.canonical_guard import protected_input_hashes
          print(json.dumps(protected_input_hashes(Path('.')), sort_keys=True, indent=2))
          PY
      - name: Ordinary DB-backed canonical read-only build
        run: python -m scripts.library_v5.build --repo-root .
      - name: Verify canonical inputs unchanged
        run: |
          python - <<'PY' > /tmp/canonical-after.json
          import json
          from pathlib import Path
          from scripts.library_v5.canonical_guard import canonical_hashes
          print(json.dumps(canonical_hashes(Path('.')), sort_keys=True, indent=2))
          PY
          cmp /tmp/canonical-before.json /tmp/canonical-after.json
      - name: Verify DB logical determinism
        run: |
          cp data/derived/db/library_db_manifest.json /tmp/db-manifest-first.json
          cp data/derived/work_pair_reasons.csv /tmp/db-reasons-first.csv
          cp data/derived/work_edges_all.csv /tmp/db-edges-first.csv
          cp data/derived/flowchart.json /tmp/flowchart-first.json
          python -m scripts.library_v5.build --repo-root .
          cmp /tmp/db-manifest-first.json data/derived/db/library_db_manifest.json
          cmp /tmp/db-reasons-first.csv data/derived/work_pair_reasons.csv
          cmp /tmp/db-edges-first.csv data/derived/work_edges_all.csv
          cmp /tmp/flowchart-first.json data/derived/flowchart.json
          python - <<'PY'
          import json
          from pathlib import Path

          def semantic_projection(path):
              payload = json.loads(path.read_text(encoding='utf-8'))
              return {key: payload[key] for key in ('schema_version', 'nodes', 'edges', 'reasons', 'characters', 'view_policy')}

          assert semantic_projection(Path('/tmp/flowchart-first.json')) == semantic_projection(Path('data/derived/flowchart.json'))
          PY
      - name: Verify DB graph regeneration without index HTML
        run: |
          cp data/derived/work_pair_reasons.csv /tmp/work_pair_reasons.csv
          cp data/derived/work_edges_all.csv /tmp/work_edges_all.csv
          cp data/derived/flowchart.json /tmp/flowchart-with-index.json
          mv index.html /tmp/index.html.legacy
          python -m scripts.library_v5.build --repo-root .
          cmp /tmp/work_pair_reasons.csv data/derived/work_pair_reasons.csv
          cmp /tmp/work_edges_all.csv data/derived/work_edges_all.csv
          test -s data/derived/flowchart.json
          cmp /tmp/flowchart-with-index.json data/derived/flowchart.json
          mv /tmp/index.html.legacy index.html
      - name: Verify static flowchart artifact contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('data/derived/flowchart.json').read_text(encoding='utf-8'))
          assert payload['schema_version'] == '1'
          assert payload['view_policy']['default_edge_visibility'] == 'all'
          assert payload['view_policy']['default_importance_mode'] == 'reference'
          node_ids = {row['work_id'] for row in payload['nodes']}
          reason_by_id = {row['reason_id']: row for row in payload['reasons']}
          assert node_ids and reason_by_id and payload['edges']
          for edge in payload['edges']:
              assert edge['source_work_id'] in node_ids
              assert edge['target_work_id'] in node_ids
              for reason_id in edge['reason_ids']:
                  reason = reason_by_id[reason_id]
                  assert reason['source_work_id'] == edge['source_work_id']
                  assert reason['target_work_id'] == edge['target_work_id']
          print(json.dumps({
              'schema_version': payload['schema_version'],
              'nodes': len(payload['nodes']),
              'edges': len(payload['edges']),
              'reasons': len(payload['reasons']),
              'default_edge_visibility': payload['view_policy']['default_edge_visibility'],
              'default_importance_mode': payload['view_policy']['default_importance_mode'],
          }, ensure_ascii=False, sort_keys=True))
          PY
      - name: Verify ordinary build determinism
        run: |
          cp data/derived/library_manifest.json /tmp/library-manifest-first.json
          cp data/derived/db/library_db_manifest.json /tmp/library-db-manifest-first.json
          python -m scripts.library_v5.build --repo-root .
          cmp /tmp/library-manifest-first.json data/derived/library_manifest.json
          cmp /tmp/library-db-manifest-first.json data/derived/db/library_db_manifest.json
          python - <<'PY' > /tmp/canonical-after-second.json
          import json
          from pathlib import Path
          from scripts.library_v5.canonical_guard import canonical_hashes
          print(json.dumps(canonical_hashes(Path('.')), sort_keys=True, indent=2))
          PY
          cmp /tmp/canonical-before.json /tmp/canonical-after-second.json
          python - <<'PY' > /tmp/protected-after-second.json
          import json
          from pathlib import Path
          from scripts.library_v5.canonical_guard import protected_input_hashes
          print(json.dumps(protected_input_hashes(Path('.')), sort_keys=True, indent=2))
          PY
          cmp /tmp/protected-before.json /tmp/protected-after-second.json
      - name: Verify SQLite integrity and print Phase 1 summary
        run: |
          python - <<'PY'
          import csv
          import json
          import sqlite3
          from pathlib import Path

          root = Path('.')
          db_path = root / 'data/derived/db/marvel.sqlite'
          connection = sqlite3.connect(db_path)
          fk = connection.execute('PRAGMA foreign_key_check').fetchall()
          integrity = connection.execute('PRAGMA integrity_check').fetchall()
          connection.close()
          assert fk == [], fk
          assert integrity == [('ok',)], integrity

          manifest = json.loads((root / 'data/derived/db/library_db_manifest.json').read_text(encoding='utf-8'))
          def csv_count(path):
              with path.open('r', encoding='utf-8-sig', newline='') as handle:
                  return sum(1 for _ in csv.DictReader(handle))
          summary = {
              'db_schema_version': manifest['db_schema_version'],
              'equivalence': manifest['equivalence'],
              'table_rows': {name: info['row_count'] for name, info in manifest['tables'].items()},
              'view_rows': {name: info['row_count'] for name, info in manifest['views'].items()},
              'graph_rows': {
                  'work_pair_reasons': csv_count(root / 'data/derived/work_pair_reasons.csv'),
                  'work_edges_all': csv_count(root / 'data/derived/work_edges_all.csv'),
              },
              'foreign_key_check_rows': len(fk),
              'integrity_check': integrity[0][0],
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Reconstruct bootstrap candidate in staging
        run: python -m scripts.library_v5.bootstrap --repo-root .
      - name: Verify bootstrap determinism and canonical isolation
        run: |
          cp data/migration/bootstrap/candidate_manifest.json /tmp/bootstrap-manifest-first.json
          python -m scripts.library_v5.bootstrap --repo-root .
          cmp /tmp/bootstrap-manifest-first.json data/migration/bootstrap/candidate_manifest.json
          python - <<'PY' > /tmp/canonical-after-bootstrap.json
          import json
          from pathlib import Path
          from scripts.library_v5.canonical_guard import canonical_hashes
          print(json.dumps(canonical_hashes(Path('.')), sort_keys=True, indent=2))
          PY
          cmp /tmp/canonical-before.json /tmp/canonical-after-bootstrap.json
          python - <<'PY' > /tmp/protected-after-bootstrap.json
          import json
          from pathlib import Path
          from scripts.library_v5.canonical_guard import protected_input_hashes
          print(json.dumps(protected_input_hashes(Path('.')), sort_keys=True, indent=2))
          PY
          cmp /tmp/protected-before.json /tmp/protected-after-bootstrap.json
      - name: Print content audit queue head
        run: |
          echo '--- CONTENT_AUDIT.md ---'
          cat data/content_audit/CONTENT_AUDIT.md
          echo '--- queue.csv (first 80 lines) ---'
          head -n 80 data/content_audit/queue.csv

  browser-selection-audit:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Chrome or Chromium
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium
            chrome="$(command -v chromium || command -v chromium-browser || true)"
          fi
          test -n "$chrome"
          echo "MARVEL_CHROME_BIN=$chrome" >> "$GITHUB_ENV"
      - name: Build browser fixture
        run: python -m scripts.library_v5.build --repo-root .
      - name: Run required headless DOM selection audit
        env:
          MARVEL_BROWSER_AUDIT: '1'
        run: python -m unittest tests.library_v5.test_browser_selection_audit.BrowserSelectionAuditTests.test_headless_dom_matches_python_oracle_for_both_public_tiers -v

  browser-interaction-audit:
    needs: browser-selection-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Chrome or Chromium
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium
            chrome="$(command -v chromium || command -v chromium-browser || true)"
          fi
          test -n "$chrome"
          echo "MARVEL_CHROME_BIN=$chrome" >> "$GITHUB_ENV"
      - name: Build browser fixture
        run: python -m scripts.library_v5.build --repo-root .
      - name: Run required headless interaction audit
        env:
          MARVEL_BROWSER_INTERACTION_AUDIT: '1'
        run: python -m unittest tests.library_v5.test_browser_interaction_audit.BrowserInteractionAuditTests.test_headless_interactions_preserve_selection_contract -v

  browser-chronology-audit:
    needs: browser-interaction-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Chrome or Chromium
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium
            chrome="$(command -v chromium || command -v chromium-browser || true)"
          fi
          test -n "$chrome"
          echo "MARVEL_CHROME_BIN=$chrome" >> "$GITHUB_ENV"
      - name: Build browser fixture
        run: python -m scripts.library_v5.build --repo-root .
      - name: Run required headless chronology audit
        env:
          MARVEL_BROWSER_CHRONOLOGY_AUDIT: '1'
        run: python -m unittest tests.library_v5.test_browser_chronology_audit.BrowserChronologyAuditTests.test_headless_chronology_contract -v
      - name: Print chronology audit JSON summary
        env:
          MARVEL_BROWSER_CHRONOLOGY_AUDIT: '1'
        run: node tests/library_v5/browser_chronology_audit.mjs --root . --chrome "$MARVEL_CHROME_BIN"
