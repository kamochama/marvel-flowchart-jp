name: Library v5 canonical freeze CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/library/**'
      - 'data/migration/**'
      - 'data/derived/**'
      - 'data/content_audit/**'
      - 'scripts/library_v5/**'
      - 'tests/library_v5/**'
      - 'views/flowchart/**'
      - '.github/workflows/library-v5-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests/library_v5 -p 'test_*.py' -v
      - name: Ordinary canonical read-only build
        run: python -m scripts.library_v5.build --repo-root .
