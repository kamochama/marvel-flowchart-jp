name: Library v5 migration CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/library/**'
      - 'data/migration/**'
      - 'data/derived/**'
      - 'scripts/library_v5/**'
      - 'tests/library_v5/**'
      - 'views/flowchart/**'
      - '.github/workflows/library-v5-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests/library_v5 -p 'test_*.py' -v
      - name: Build and audit migration
        run: python -m scripts.library_v5.build --repo-root .
      - name: Capture first deterministic manifest
        run: cp data/library/manifest.json /tmp/library-v5-manifest-first.json
      - name: Rebuild clean
        run: python -m scripts.library_v5.build --repo-root .
      - name: Verify deterministic output manifest
        run: cmp /tmp/library-v5-manifest-first.json data/library/manifest.json
      - name: Print migration audit
        if: always()
        run: |
          echo '--- MIGRATION_AUDIT.md ---'
          cat data/migration/MIGRATION_AUDIT.md || true
          echo '--- audit.json ---'
          cat data/migration/audit.json || true
