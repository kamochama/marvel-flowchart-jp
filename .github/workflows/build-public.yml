name: Build and deploy public site

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'README.md'
      - 'AUDIT.md'
      - 'AUDIT.json'
      - 'preview.png'
      - '.nojekyll'
      - '.github/workflows/build-public.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'README.md'
      - 'AUDIT.md'
      - 'AUDIT.json'
      - 'preview.png'
      - '.nojekyll'
      - '.github/workflows/build-public.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
      - name: Build generated public index
        run: python scripts/build_public.py --output index.html
      - name: Verify source layout and release contract
        run: |
          python tests/test_source_layout.py
          python tests/test_build_roundtrip.py
          python tests/test_work_details.py
          python tests/test_overview_v515.py
          python tests/test_release_contract_v515.py
          python tests/test_pages_workflow.py
          grep -q 'PUBLIC v5.15.0' index.html
      - name: Stage exact public site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html README.md AUDIT.md AUDIT.json preview.png .nojekyll _site/
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Upload downloadable public ZIP artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: marvel-flowchart-jp-public
          path: _site/
          include-hidden-files: true
          retention-days: 30

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
