name: Build public index

on:
  push:
    branches:
      - main
      - sync/v5.14.1
      - feature/v5.15.0-overview-details
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-public.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
      - name: Build generated public index
        run: python scripts/build_public.py --output index.html
      - name: Verify source layout and release contract
        run: |
          python tests/test_source_layout.py
          python tests/test_build_roundtrip.py
          python tests/test_work_details.py
          python tests/test_overview_v515.py
          python tests/test_release_contract_v515.py
          grep -q 'PUBLIC v5.14.1\|PUBLIC v5.15.0' index.html
      - name: Upload exact public release files
        uses: actions/upload-artifact@v4
        with:
          name: marvel-flowchart-jp-v5.15.0
          path: |
            index.html
            README.md
            AUDIT.md
            AUDIT.json
            preview.png
            .nojekyll
          include-hidden-files: true
          if-no-files-found: error
      - name: Commit generated index when changed
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'generated index is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'build: refresh generated public index [skip ci]'
          git push
