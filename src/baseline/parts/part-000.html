<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e11d48'/%3E%3Cpath d='M14 45V19h9l9 14 9-14h9v26h-8V31L32 46 22 31v14z' fill='white'/%3E%3C/svg%3E">
<title>マーベル作品相関図 日本版 — 作品から前史・後続をたどる</title>
<style>
:root{--bg:#0b1020;--panel:#0f172a;--card:#111827;--line:#334155;--text:#e5e7eb;--muted:#94a3b8}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
header{padding:12px 16px;background:#111827;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:21px}.sub{color:var(--muted);font-size:12px;margin-top:3px}.controls,.tabs{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px}
input,select,button{background:var(--panel);color:var(--text);border:1px solid #475569;border-radius:8px;padding:7px 9px;font-size:13px}button{cursor:pointer}button.active,.tab.active{background:#2563eb;border-color:#2563eb}
main{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:calc(100vh - 95px)}#left{padding:10px;border-right:1px solid var(--line);min-width:0}#right{padding:10px;background:var(--panel);overflow:auto}
.panel{display:none}.panel.active{display:block}.svg-wrap{background:#fff;border-radius:10px;overflow:auto;padding:5px;max-height:calc(100vh - 190px)}.svg-wrap{
  background:#fff;border-radius:10px;overflow:hidden;padding:0;max-height:calc(100vh - 190px);
  min-height:520px; position:relative; touch-action:none; cursor:grab;
}
.svg-wrap.dragging{cursor:grabbing}
.svg-wrap svg{
  display:block; width:auto; height:auto; min-width:0; max-width:none;
  transform-origin:0 0; user-select:none; -webkit-user-select:none;
}
.svg-wrap svg g.node{cursor:pointer}
.svg-wrap svg g.node:hover{filter:drop-shadow(0 0 6px #2563eb)}
.svg-wrap svg.char-mode g.node,.svg-wrap svg.char-mode g.edge{opacity:.14}
.svg-wrap svg g.node.charhl{opacity:1;filter:drop-shadow(0 0 8px #fbbf24)}
.svg-wrap svg.char-mode g.node.charhl{opacity:1;filter:drop-shadow(0 0 10px #fbbf24)}

.svg-wrap .zoom-hint{
  position:absolute;right:10px;bottom:8px;z-index:5;background:rgba(15,23,42,.88);
  color:#e5e7eb;border:1px solid #475569;border-radius:8px;padding:5px 8px;font-size:11px;
  pointer-events:none;
}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}.card h3{margin:0 0 8px;font-size:15px}.muted{color:var(--muted)}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;margin:2px 4px 2px 0;background:#1f2937}.warn{color:#fbbf24}
.node-list{max-height:270px;overflow:auto;border:1px solid var(--line);border-radius:8px}.node-item{padding:7px 8px;border-bottom:1px solid #1f2937;cursor:pointer;font-size:13px}.node-item:hover{background:#172033}.node-item.selected{background:#1d4ed8}
.prep-list{margin:8px 0 0;padding:0;list-style:none}
.prep-item{display:grid;grid-template-columns:30px 1fr;gap:7px;align-items:start;padding:7px 0;border-bottom:1px solid #263246}
.prep-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1d4ed8;color:#fff;font-weight:700;font-size:12px}
.prep-goal{margin-top:9px;padding:8px;border:1px solid #ef4444;border-radius:8px;background:#30151d}
.prep-source{font-size:11px;color:#94a3b8;margin-top:5px}

table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:5px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:var(--card)}#edgewrap{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.svg-wrap svg g.node,.svg-wrap svg g.edge{transition:opacity .15s ease,filter .15s ease}.svg-wrap svg.dim g.node{opacity:.14;filter:grayscale(.62) saturate(.38) brightness(.72)}.svg-wrap svg.dim g.edge{opacity:.035;filter:grayscale(.75) saturate(.22) brightness(.58)}
.svg-wrap svg.dim g.node.hl{opacity:1;filter:saturate(1.35) brightness(1.16) drop-shadow(0 0 12px #2563eb)}
.svg-wrap svg.dim g.node.focus{opacity:1;filter:saturate(1.38) brightness(1.22) drop-shadow(0 0 22px #ef4444)}
.svg-wrap svg.dim g.edge.hl{opacity:1;filter:saturate(1.24) brightness(1.14) drop-shadow(0 0 8px #60a5fa)}
/* v5.7.7 directional relationship highlighting */
.svg-wrap svg.dim g.node.backhl{opacity:1;filter:saturate(1.28) brightness(1.12) drop-shadow(0 0 11px #38bdf8)}
.svg-wrap svg.dim g.node.forwardhl{opacity:1;filter:saturate(1.28) brightness(1.12) drop-shadow(0 0 11px #34d399)}
.svg-wrap svg.dim g.node.bothhl{opacity:1;filter:saturate(1.34) brightness(1.15) drop-shadow(0 0 12px #a78bfa)}
.svg-wrap svg.dim g.node.contexthl{opacity:1;filter:saturate(1.18) brightness(1.07) drop-shadow(0 0 8px #f59e0b)}
.svg-wrap svg.dim g.edge.backhl{opacity:1;filter:saturate(1.2) brightness(1.08) drop-shadow(0 0 6px #38bdf8)}
.svg-wrap svg.dim g.edge.forwardhl{opacity:1;filter:saturate(1.2) brightness(1.08) drop-shadow(0 0 6px #34d399)}
.svg-wrap svg.dim g.edge.contexthl{opacity:.9;filter:saturate(1.1) brightness(1.04) drop-shadow(0 0 4px #f59e0b)}
/* v5.7.9: make the actual Graphviz path + arrowhead visible, not just the edge group glow. */
.svg-wrap svg.dim g.edge.hl{opacity:1!important}
.svg-wrap svg.dim g.edge.hl path{opacity:1!important;stroke-width:4.2px!important}
.svg-wrap svg.dim g.edge.hl polygon{opacity:1!important;stroke-width:3.2px!important}

/* v5.10.12 public baseline: factual master edges absent from the old Graphviz snapshot are
   materialized once as neutral SVG edges, so all master connections are visible before selection. */
.svg-wrap svg g.master-edge-overlay{opacity:1;pointer-events:none}
.svg-wrap svg g.master-edge-overlay path{fill:none;stroke:#64748b;stroke-width:1.35px;stroke-dasharray:5 4}
.svg-wrap svg g.master-edge-overlay polygon{fill:#64748b;stroke:#64748b;stroke-width:1px}

.svg-wrap svg g.dynamic-edge-overlay{opacity:1!important;pointer-events:none}
.svg-wrap svg g.dynamic-edge-overlay path{fill:none;opacity:1!important;stroke-width:4.4px!important}
.svg-wrap svg g.dynamic-edge-overlay.backhl path{stroke:#60a5fa!important}
.svg-wrap svg g.dynamic-edge-overlay.forwardhl path{stroke:#34d399!important}
.svg-wrap svg g.dynamic-edge-overlay.contexthl path{stroke:#f59e0b!important;stroke-dasharray:7 5}
.svg-wrap svg g.dynamic-edge-overlay.compressed path{stroke-dasharray:10 6;stroke-width:3.8px!important;opacity:.96!important}
.svg-wrap svg g.dynamic-edge-overlay.bothhl path{stroke:#a78bfa!important}

.svg-wrap svg.dim g.edge.backhl path{stroke:#38bdf8!important}
.svg-wrap svg.dim g.edge.backhl polygon{stroke:#38bdf8!important;fill:#38bdf8!important}
.svg-wrap svg.dim g.edge.forwardhl path{stroke:#34d399!important}
.svg-wrap svg.dim g.edge.forwardhl polygon{stroke:#34d399!important;fill:#34d399!important}
.svg-wrap svg.dim g.edge.contexthl path{stroke:#f59e0b!important;stroke-width:3.6px!important;stroke-dasharray:8 5}
.svg-wrap svg.dim g.edge.contexthl polygon{stroke:#f59e0b!important;fill:#f59e0b!important}
.svg-wrap svg.dim g.edge.bothhl path{stroke:#a78bfa!important;stroke-width:4.6px!important}
.svg-wrap svg.dim g.edge.bothhl polygon{stroke:#a78bfa!important;fill:#a78bfa!important}

.direction-key{display:inline-flex;gap:7px;align-items:center;color:var(--muted);font-size:11px;white-space:nowrap}.direction-key i{display:inline-block;width:15px;height:3px;border-radius:3px}.direction-key .bk{background:#38bdf8}.direction-key .fw{background:#34d399}.direction-key .cx{background:#f59e0b}


/* v5.9.3: explain why each preparation item matters */
.prep-item-main{min-width:0}
.prep-item-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:3px}
.prep-why{margin-top:4px;font-size:11px;color:#cbd5e1;line-height:1.45}
.prep-next{color:#93c5fd}
.prep-imp{display:inline-block;padding:1px 6px;border-radius:999px;font-size:10px;font-weight:700}
.prep-imp.core{background:#153b2f;color:#86efac;border:1px solid #166534}
.prep-imp.recommended{background:#3a2f14;color:#fde68a;border:1px solid #854d0e}
.prep-imp.reference{background:#312e49;color:#c4b5fd;border:1px solid #5b21b6}

@media(max-width:980px){main{grid-template-columns:1fr}#left{border-right:none}#right{border-top:1px solid var(--line)}.svg-wrap{max-height:64vh}}

/* v5.7.1: multi-selection composition + tiered preparation plan */
.combine-btn.active,.prep-tier.active{background:#7c3aed;border-color:#8b5cf6}
.prep-tier-controls{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 9px}
.prep-tier-controls button{padding:5px 8px;font-size:12px}
.selection-mode-note{margin-top:6px;font-size:11px;color:#94a3b8}
.selbadge{display:inline-flex;align-items:center;gap:3px;padding-right:3px}
.selbadge .seljump{cursor:pointer}
.selremove{border:0;background:transparent;color:#cbd5e1;padding:0 4px;line-height:1.35;font-size:14px;border-radius:999px}
.selremove:hover{background:#7f1d1d;color:#fff}
.prep-tier-label{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:#312e81;color:#e0e7ff;font-size:11px}
.prep-explain{margin:7px 0 2px;padding:7px 8px;border-left:3px solid #6366f1;background:#171b34;font-size:11px;color:#cbd5e1}

/* v5.10.8: watch progress dashboard + preparation remaining-time estimates */
.prep-time-summary{margin:9px 0 10px;padding:9px 10px;border:1px solid #155e75;border-radius:10px;background:linear-gradient(135deg,#082f49 0%,#0c2236 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.prep-time-main{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}.prep-time-main strong{font-size:15px;color:#e0f2fe}.prep-time-icon{font-size:14px}.prep-time-sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.prep-time-chip,.prep-runtime{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:999px;border:1px solid #28506a;background:#0a1d2d;color:#bae6fd;font-size:10px;white-space:nowrap}.prep-runtime{border-color:#334155;background:#111827;color:#cbd5e1}.prep-time-note{margin-top:5px;color:#8fa9bd;font-size:10px;line-height:1.45}.prep-time-missing{color:#fcd34d}.prep-goal .prep-runtime{margin-left:5px;vertical-align:middle}

/* v5.7.1 connection reaudit overlay */
g.edge.audit-added{pointer-events:none;transition:opacity .15s ease,filter .15s ease}
g.edge.audit-added path{fill:none;stroke-width:2.1;opacity:.82;vector-effect:non-scaling-stroke}
g.edge.audit-added[data-layer="story"] path{stroke:#22c55e}
g.edge.audit-added[data-layer="character"] path{stroke:#38bdf8}
g.edge.audit-added[data-layer="legacy"] path{stroke:#a78bfa;stroke-dasharray:5 5}
g.edge.audit-added[data-layer="official_return"] path{stroke:#f59e0b;stroke-dasharray:8 5}
g.edge.audit-added[data-strength="very strong"] path{stroke-width:3.1}
g.edge.audit-added[data-strength="medium"] path{stroke-width:1.8}
g.edge.audit-added.audit-hidden{display:none}
.audit-edge-key{font-size:11px;color:#cbd5e1;display:inline-flex;gap:6px;align-items:center}
.audit-dot{display:inline-block;width:10px;height:3px;border-radius:2px}.audit-dot.story{background:#22c55e}.audit-dot.character{background:#38bdf8}.audit-dot.legacy{background:#a78bfa}.audit-dot.return{background:#f59e0b}

/* v5.7.2: fan-summary discovered, independently verified connections */
g.edge.fan-verified{pointer-events:none;transition:opacity .15s ease,filter .15s ease}
g.edge.fan-verified path{fill:none;stroke:#fb7185;stroke-width:2.25;opacity:.9;vector-effect:non-scaling-stroke}
g.edge.fan-verified[data-strength="very strong"] path{stroke-width:3.2}
g.edge.fan-verified[data-strength="medium"] path{stroke-width:1.85;stroke-dasharray:7 5}
g.edge.fan-verified[data-render="dotted"] path{stroke-dasharray:2 5}
g.edge.fan-verified.fan-hidden{display:none}
.fan-edge-key{font-size:11px;color:#cbd5e1;display:inline-flex;gap:6px;align-items:center}.fan-edge-swatch{display:inline-block;width:12px;height:3px;border-radius:2px;background:#fb7185}

/* v5.8.1: regenerated graph tabs from the 199-edge snapshot; final master overlays may add audited references. */
.flow-tabs-note{background:#0b1020}

/* v5.8.1: viewing-importance layer, independent of factual strength */
.importance-key{display:inline-flex;align-items:center;gap:4px;margin-left:4px;white-space:nowrap}.importance-btn{padding:4px 8px}.importance-btn.active{outline:1px solid #60a5fa;background:#172554}.importance-btn[data-importance-mode="core"]{border-color:#22c55e}.importance-btn[data-importance-mode="recommended"]{border-color:#60a5fa}.importance-btn[data-importance-mode="reference"]{border-color:#a78bfa}.importance-dot{display:inline-block;width:12px;height:3px;border-radius:3px;margin:0 2px}.importance-dot.core{background:#e5e7eb}.importance-dot.recommended{background:#60a5fa;opacity:.8}.importance-dot.reference{background:#a78bfa;opacity:.55}
.svg-wrap svg:not(.dim) g.edge.imp-recommended{opacity:.78}.svg-wrap svg:not(.dim) g.edge.imp-reference{opacity:.52}.svg-wrap svg g.edge.importance-hidden{display:none!important}.svg-wrap svg.dim g.edge.hl:not(.importance-hidden){opacity:1!important}
.importance-summary{font-size:12px;color:#94a3b8;margin-top:4px}

/* v5.9.0: directed PATH mode, independent viewing target, edge evidence tooltips */
.combine-btn[data-combine="path"]{border-color:#a78bfa}.combine-btn[data-combine="path"].active{background:#2e1065;outline:1px solid #c4b5fd}
.svg-wrap svg.dim g.node.pathhl{opacity:1!important;filter:saturate(1.25) brightness(1.12) drop-shadow(0 0 10px #a78bfa)!important}
.svg-wrap svg.dim g.edge.pathhl{opacity:1!important;filter:drop-shadow(0 0 7px #a78bfa)!important}
.svg-wrap svg.dim g.edge.pathhl path{stroke:#c4b5fd!important;stroke-width:3.8!important;opacity:1!important;fill:none!important}
.svg-wrap svg.dim g.edge.pathhl polygon{fill:#c4b5fd!important;stroke:#c4b5fd!important;opacity:1!important}
.svg-wrap svg g.edge path,.svg-wrap svg g.edge polygon{vector-effect:non-scaling-stroke}
.path-key i{display:inline-block;width:16px;height:3px;border-radius:3px;background:#c4b5fd;vertical-align:middle;margin:0 3px}
.target-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.target-row select{min-width:0;flex:1 1 230px;background:#0f172a;color:#e5e7eb;border:1px solid #334155;border-radius:6px;padding:7px}.target-row button{white-space:nowrap}
.target-status{margin-top:7px;font-size:12px;color:#cbd5e1}.target-status.locked{color:#fbbf24}.target-help{font-size:11px;color:#94a3b8;margin-top:5px;line-height:1.45}
.edge-tooltip-note{font-size:11px;color:#94a3b8;margin-top:5px}.selection-mode-note.path-note{color:#ddd6fe}

/* v5.9.1: readable PATH explanation and reliable edge hover */
.svg-wrap svg g.edge,.svg-wrap svg g.edge path,.svg-wrap svg g.edge polygon{pointer-events:visiblePainted}
.svg-wrap svg g.edge.fan-verified{pointer-events:visiblePainted}
.path-explain{display:none}.path-explain.active{display:block}.path-route{margin:8px 0;padding:8px 9px;border:1px solid #3f3f46;border-radius:8px;background:#111827}.path-route-title{font-weight:700;color:#ddd6fe;margin-bottom:5px}.path-step{display:flex;gap:7px;align-items:flex-start;margin:4px 0;font-size:12px}.path-arrow{color:#a78bfa;font-weight:700}.path-edge-meta{color:#94a3b8;font-size:11px}.path-imp{display:inline-block;padding:1px 5px;border-radius:999px;margin-left:4px;border:1px solid #475569}.path-imp.core{color:#86efac;border-color:#166534}.path-imp.recommended{color:#93c5fd;border-color:#1d4ed8}.path-imp.reference{color:#c4b5fd;border-color:#6d28d9}.path-missing{color:#fca5a5;font-size:12px;margin:5px 0}

/* v5.9.4: story-family focus without disturbing the lower-crossing Graphviz geometry */
.family-select{background:#0f172a;color:#e5e7eb;border:1px solid #334155;border-radius:6px;padding:5px 7px;max-width:230px}
.family-key{font-size:11px;color:#94a3b8;white-space:nowrap}
.svg-wrap svg.family-mode g.node{opacity:.16;filter:grayscale(.55) saturate(.45) brightness(.72)}
.svg-wrap svg.family-mode g.edge{opacity:.045;filter:grayscale(.65) saturate(.35) brightness(.65)}
.svg-wrap svg.family-mode g.node.familyhl{opacity:1;filter:saturate(1.18) brightness(1.08) drop-shadow(0 0 9px #fbbf24)}
.svg-wrap svg.family-mode g.edge.familyedge{opacity:.82;filter:saturate(1.05) brightness(1.03)}
.svg-wrap svg.family-mode g.edge.familyedge path{stroke:#fbbf24!important;stroke-width:2.5px!important}
.svg-wrap svg.family-mode g.edge.familyedge polygon{fill:#fbbf24!important;stroke:#fbbf24!important}
.svg-wrap svg:not(.family-mode) g.node.familyhl:not(.focus){filter:drop-shadow(0 0 6px #fbbf24)}


.path-pref-wrap{display:inline-flex;gap:4px;align-items:center}.path-pref-btn.active{background:#312e81;border-color:#818cf8;outline:1px solid #a5b4fc}.path-route.active-route{border-color:#8b5cf6;box-shadow:0 0 0 1px #6d28d9 inset}.path-route-alt-note{font-size:11px;color:#94a3b8;margin:3px 0 7px}.path-route-profile{display:inline-block;font-size:11px;margin-left:6px;padding:1px 6px;border-radius:999px;background:#1e1b4b;color:#c4b5fd;border:1px solid #4c1d95}.path-route-profile.active{background:#4c1d95;color:#ede9fe}

/* v5.9.8: responsive mobile UI. Same HTML works on desktop and phones. */
.mobile-actions,.mobile-sheet-head,.mobile-graph-actions,.mobile-backdrop{display:none}
@media(max-width:760px){
  html,body{overscroll-behavior:none}
  body{padding-bottom:0}
  header{padding:9px 10px;z-index:40}
  header h1{font-size:17px;line-height:1.25;padding-right:116px}
  header .sub{font-size:10.5px;line-height:1.35;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobile-actions{display:flex;position:absolute;right:9px;top:8px;gap:5px}
  .mobile-actions button{min-height:36px;padding:6px 9px;font-size:12px;background:#172033}
  header .controls{display:none;margin-top:8px;padding-top:8px;border-top:1px solid #334155;max-height:62dvh;overflow:auto;overscroll-behavior:contain}
  header.controls-open .controls{display:flex}
  .controls>input,.controls>select{flex:1 1 100%;min-width:0}
  .controls #q{width:100%}
  .controls .muted{flex:0 0 auto}
  .controls button,.controls select,.controls input{min-height:42px;font-size:16px}
  .controls .direction-key,.controls .family-key,.controls .audit-edge-key,.controls .fan-edge-key{white-space:normal;line-height:1.35}
  .controls .importance-key,.controls .path-pref-wrap{flex-wrap:wrap}

  main{display:block;min-height:0}
  #left{padding:7px;border-right:0}
  .tabs{margin-top:0;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:2px 1px 7px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs .tab{flex:0 0 auto;min-height:42px;padding:8px 10px;font-size:12px;scroll-snap-align:start}
  .flow-tabs-note{display:none}
  .svg-wrap{height:65dvh;min-height:430px;max-height:none!important;border-radius:8px;touch-action:none;overscroll-behavior:auto;background:#fff}
  .svg-wrap .zoom-hint{left:8px;right:auto;bottom:8px;font-size:10px;padding:4px 7px;max-width:72%;white-space:normal}
  .svg-wrap svg g.node{touch-action:none}

/* v5.10.0 — selection dimming is the highest-priority visual state.
   Family/character browsing may decorate a node, but it must never cancel
   the work-selection dim state. */
.svg-wrap svg.dim g.node,.svg-wrap svg.dim g.edge{transition:none!important;}
.svg-wrap svg.dim g.node:not(.hl):not(.focus){
  opacity:.14!important;
  filter:grayscale(.62) saturate(.38) brightness(.72)!important;
}
.svg-wrap svg.dim g.edge:not(.hl){
  opacity:.035!important;
  filter:grayscale(.75) saturate(.22) brightness(.58)!important;
}
.svg-wrap svg.dim g.node.hl,
.svg-wrap svg.dim g.node.focus,
.svg-wrap svg.dim g.edge.hl{
  opacity:1!important;
}
/* If a secondary browse mode happened to remain attached, selection wins. */
.svg-wrap svg.dim.family-mode g.node.familyhl:not(.hl):not(.focus),
.svg-wrap svg.dim.char-mode g.node.charhl:not(.hl):not(.focus){
  opacity:.14!important;
}
.svg-wrap svg.dim.family-mode g.edge.familyedge:not(.hl){
  opacity:.035!important;
}
